%YAML 1.3
---
- Test: thumb_wheel_up
- KeyPress:
  - [Shift_L, XF86_AudioRaiseVolume]
  - click
...
---
- Test: thumb_wheel_down
- KeyPress:
  - [Shift_L, XF86_AudioLowerVolume]
  - click
...
---
- Key: [Back Button, pressed]
- KeyPress:
  - XF86_AudioPrev
  - click
...
---
- Key: [Forward Button, pressed]
- KeyPress:
  - XF86_AudioNext
  - click
...
---
- Key: [Mouse Gesture Button, pressed]
- KeyPress:
  - XF86_AudioPlay
  - click
...
---
- Key: [Haptic, pressed]
- Set: [B4674F1B, haptic-play, 9]
...
